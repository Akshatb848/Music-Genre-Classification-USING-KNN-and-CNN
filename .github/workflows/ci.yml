name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install + smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest nbformat

      - name: Check dependency consistency
        run: python -m pip check

      - name: Import every library the notebooks use
        run: python -c "import kagglehub, numpy, scipy, pandas, sklearn, librosa, matplotlib, PIL, tqdm, tensorflow; print('imports ok')"

      - name: Validate notebooks and README claims (no training is run)
        run: pytest -q tests

      - name: Redraw README charts from notebook outputs
        run: python scripts/make_figures.py
